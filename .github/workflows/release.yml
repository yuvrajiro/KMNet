name: Release to PyPI

# Push a tag like vX.Y.Z (matching kmnet.__version__) and this workflow builds the
# sdist + wheel, uploads them to PyPI and creates a GitHub Release.
#
# One-time setup: add a PyPI API token as the repository secret PYPI_API_TOKEN
# (GitHub -> Settings -> Secrets and variables -> Actions).
#
#   git tag -a vX.Y.Z -m "release notes" && git push origin vX.Y.Z

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # dry run: build + check only, no upload

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(grep -oP '__version__ = "\K[^"]+' src/kmnet/__init__.py)
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG tag=$TAG"
          test "$PKG" = "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      # release notes = the annotated tag's message (git tag -a vX.Y.Z -m "notes")
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Release notes from tag message
        run: |
          cd src
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > ../release_notes.md
          cat ../release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
