name: Release to PyPI

# Push a tag like v0.2.0 (matching kmnet.__version__) and this workflow builds the
# sdist + wheel, uploads them to PyPI and creates a GitHub Release.
#
# One-time setup: add a PyPI API token as the repository secret PYPI_API_TOKEN
# (GitHub -> Settings -> Secrets and variables -> Actions).
#
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # dry run: build + check only, no upload

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(grep -oP '__version__ = "\K[^"]+' src/kmnet/__init__.py)
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG tag=$TAG"
          test "$PKG" = "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
